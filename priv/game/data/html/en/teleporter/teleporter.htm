<html>
<head>
<title>%npcName% - Teleportation Service</title>
</head>
<body>
<br>
<center>
<font color="CCCCCC">Teleportation Service</font>
<br>
Greetings %charName%!<br>
I am %npcName%, and I offer reliable teleportation services across the realm.<br>
<br>
<table width="100%">
<tr><td align="center">
<button value="Start Teleport" action="bypass -h npc_%objectId%_start" width="200" height="20" back="L2UI_ct1.button_df" fore="L2UI_ct1.button_df"/>
</td></tr>
<tr><td align="center">
<button value="Cancel" action="bypass -h npc_%objectId%_cancel" width="200" height="20" back="L2UI_ct1.button_df" fore="L2UI_ct1.button_df"/>
</td></tr>
</table>
</center>
</body>
</html>
